name: CI

# Every pull request, not only those targeting main. A chain of feature
# branches merging into each other — lookup-resources into feature into
# development into main — previously ran CI on the last hop alone, so the
# earlier PRs reported "no checks reported", which reads as clean and means
# untested. A Pint failure reached main that way.
#
# This is also the only enforcement available: the repository is private on a
# free organisation plan, where GitHub offers neither branch protection nor
# rulesets, so a red check cannot block a merge. See
# docs/how-to/use-ci.md.
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: online-store

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: online_shop_test
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Matches composer.lock, which is solved against PHP 8.4-only
          # symfony/* packages — see docker/php/Dockerfile for the same note.
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, bcmath, gd, zip, intl, exif
          coverage: pcov

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: online-store/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: online-store/vendor
          key: composer-${{ hashFiles('online-store/composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: online_shop_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --force

      # Deterministic checks block the merge; a human or LLM review advises,
      # it does not replace this.
      - name: Pint (formatting)
        run: ./vendor/bin/pint --test

      - name: PHPStan / Larastan (static analysis)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G

      # phpunit.xml sets DB_CONNECTION=mysql and DB_DATABASE=online_shop_test;
      # host, port and credentials come from here. Tests run against the same
      # engine as production because SQLite enforces neither column lengths nor
      # the CHECK constraints from ADR-0005 — see docs/how-to/use-ci.md.
      #
      # Coverage is collected, not gated — no --min threshold. ADR-0009: a
      # number this project already distrusts as proof (reference/write-rules/concurrency.md)
      # shouldn't be able to block a merge on its own.
      - name: Pest (tests, with coverage)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: password
        run: ./vendor/bin/pest --coverage --coverage-clover=coverage.xml --coverage-html=coverage-html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: online-store/coverage-html
          retention-days: 14
