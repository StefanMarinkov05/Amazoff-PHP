name: CI

# See docs/how-to/use-ci.md for the reasoning behind this trigger, the job
# split, and the concurrency shards below.
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: src

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, bcmath, gd, zip, intl, exif
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: src/vendor
          key: composer-${{ hashFiles('src/composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Pint (formatting)
        run: ./vendor/bin/pint --test

      - name: PHPStan / Larastan (static analysis)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G

  test:
    name: test (${{ matrix.shard.name }})
    runs-on: ubuntu-latest

    # Shards, not one job. ADR-0010 has the timing behind the original
    # 2-shard split; rebalanced into 4 on 2026-08-29 once tests/Feature/
    # Filament and tests/Feature/Auth grew enough that shard 2 was carrying
    # roughly 2x shard 1's measured local time (55s vs 28s) on its own —
    # exactly the "visibly outruns the others" trigger use-ci.md's own
    # policy names for a re-balance, not a fixed schedule. tests/Feature/
    # Actions was the single heaviest concentration and moved out of shard 2
    # entirely; measured on its own it was still uneven enough (Cart+
    # Catalogue at 24s, the rest of Actions at 24s, almost by coincidence)
    # to split into shards 3 and 4 rather than landing as one new dominant
    # shard replacing the old one. Local measured split:
    # shard 1 ≈ 28.5s, shard 2 ≈ 18.6s, shard 3 ≈ 24.3s, shard 4 ≈ 24.1s.
    #
    # A new tests/Unit or tests/Feature file goes in shard 2 by default,
    # unless it shares RolePermissionTest's per-test reseeding pattern
    # (shard 1) or belongs under tests/Feature/Actions — Cart/Catalogue go
    # in shard 3, every other Actions subdirectory in shard 4. Keeping
    # Actions off shard 2 is deliberate: that directory is where most of
    # this codebase's tests live and grows fastest, so leaving it on shard 2
    # would silently regrow the exact imbalance this rebalance fixed.
    strategy:
      matrix:
        shard:
          - name: "1"
            paths: >-
              tests/Feature/RolePermissionTest.php
              tests/Feature/RoleResourceTest.php
              tests/Feature/Actions/Catalogue/ProductImageTest.php
              tests/Unit/Enums/TransitionMatrixTest.php
          - name: "2"
            paths: >-
              tests/Unit/Enums/EnumCompletenessTest.php
              tests/Unit/Support/MoneyTest.php
              tests/Feature/Auth
              tests/Feature/Console
              tests/Feature/CookieConsentBannerTest.php
              tests/Feature/ExampleTest.php
              tests/Feature/FactoryTest.php
              tests/Feature/Filament
              tests/Feature/Http
              tests/Feature/Livewire
              tests/Feature/Mail
              tests/Feature/Models
              tests/Feature/Payment
              tests/Feature/Support
          - name: "3"
            paths: >-
              tests/Feature/Actions/Cart
              tests/Feature/Actions/Catalogue/AddProductVariationTest.php
              tests/Feature/Actions/Catalogue/ConcurrentProductEditTest.php
              tests/Feature/Actions/Catalogue/CreateProductTest.php
              tests/Feature/Actions/Catalogue/DeleteAttributeTest.php
              tests/Feature/Actions/Catalogue/DeleteBrandTest.php
              tests/Feature/Actions/Catalogue/DeleteProductCategoryTest.php
              tests/Feature/Actions/Catalogue/DeleteProductTest.php
              tests/Feature/Actions/Catalogue/ForceDeleteProductVariationTest.php
              tests/Feature/Actions/Catalogue/RecordPriceObservationTest.php
              tests/Feature/Actions/Catalogue/RemoveProductVariationTest.php
              tests/Feature/Actions/Catalogue/SetProductAttributeValuesTest.php
              tests/Feature/Actions/Catalogue/SetVariationAttributeValuesTest.php
              tests/Feature/Actions/Catalogue/SetVariationImagesTest.php
          - name: "4"
            paths: >-
              tests/Feature/Actions/Contact
              tests/Feature/Actions/Content
              tests/Feature/Actions/Coupon
              tests/Feature/Actions/Gdpr
              tests/Feature/Actions/Inventory
              tests/Feature/Actions/Order
              tests/Feature/Actions/Payment
              tests/Feature/Actions/ProductReview
              tests/Feature/Actions/Returns
              tests/Feature/Actions/Shipment

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: amazoff_test
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, bcmath, gd, zip, intl, exif
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: src/vendor
          key: composer-${{ hashFiles('src/composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: amazoff_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --force

      - name: Pest (tests, shard ${{ matrix.shard.name }})
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: password
        run: ./vendor/bin/pest ${{ matrix.shard.paths }}

  test-concurrency:
    name: test-concurrency (${{ matrix.shard.name }})
    runs-on: ubuntu-latest

    # Shards, not one job. ADR-0010 has the timing behind the split; adding
    # a new tests/Concurrency file goes in the lightest shard, or earns its
    # own once shards drift far enough apart to matter again.
    strategy:
      matrix:
        shard:
          - name: a
            paths: >-
              tests/Concurrency/AddToCartVsMergeGuestCartConcurrencyTest.php
              tests/Concurrency/StripeWebhookConcurrencyTest.php
              tests/Concurrency/RequestReturnConcurrencyTest.php
          - name: b
            paths: >-
              tests/Concurrency/AddToCartConcurrencyTest.php
              tests/Concurrency/MergeGuestCartConcurrencyTest.php
              tests/Concurrency/ReleaseStockConcurrencyTest.php
              tests/Concurrency/ReserveStockConcurrencyTest.php
              tests/Concurrency/RedeemCouponConcurrencyTest.php
              tests/Concurrency/TransitionOrderStatusConcurrencyTest.php
              tests/Concurrency/SetVariationImagesConcurrencyTest.php
              tests/Concurrency/CreateShipmentConcurrencyTest.php
              tests/Concurrency/RecordPaymentConcurrencyTest.php
          - name: c
            paths: >-
              tests/Concurrency/ForceDeleteProductVariationConcurrencyTest.php
              tests/Concurrency/MainProductImageConcurrencyTest.php
              tests/Concurrency/PublishProductConcurrencyTest.php
              tests/Concurrency/CreateOrderConcurrencyTest.php
              tests/Concurrency/DeleteProductCategoryConcurrencyTest.php
              tests/Concurrency/CreateProductReviewConcurrencyTest.php
              tests/Concurrency/SetVariationAttributeValuesConcurrencyTest.php

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: amazoff_test
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, bcmath, gd, zip, intl, exif
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: src/vendor
          key: composer-${{ hashFiles('src/composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: amazoff_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --force

      - name: Pest (concurrency tests, shard ${{ matrix.shard.name }})
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: password
        run: ./vendor/bin/pest ${{ matrix.shard.paths }}

  test-browser:
    name: test-browser
    runs-on: ubuntu-latest

    # The Pest 5 real-browser suite (tests/Browser/, ADR-0017). One job, not
    # sharded — it is ~7 tests / ~2 min, dominated by Chromium context setup
    # per test, which sharding would not help.
    #
    # No app server is started: pest-plugin-browser boots the application
    # in-process (an amphp HTTP server calling the HTTP kernel) and drives
    # Chromium against that. What it does need that no other job does:
    #   - the `sockets` PHP extension (the plugin talks to its Playwright
    #     server over a socket);
    #   - Node, the `playwright` npm package (`npm ci`), and Chromium plus
    #     its system libraries (`npx playwright install --with-deps`);
    #   - a real `npm run build` — @vite must resolve against the built
    #     manifest or every page renders unstyled and ResponsiveTest's
    #     compiled-CSS precondition fails loudly (which is the point of it).
    #
    # ThreeDSecureTest skips itself here — use-ci.md is categorical that no
    # Stripe/Econt/Speedy secret goes in CI, and that test needs a real
    # Stripe test key plus a live `stripe listen`. It is a local runbook.

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: amazoff_browser
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, bcmath, gd, zip, intl, exif, sockets
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: src/vendor
          key: composer-${{ hashFiles('src/composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Build front-end assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: amazoff_browser
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --force

      - name: Pest (browser suite)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: password
        run: ./vendor/bin/pest -c phpunit.browser.xml
