server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Dev-only parity with the header hardening in
    # App\Http\Middleware\SetSecurityHeaders — this file is not what runs in
    # production (Forge provisions its own nginx directly on the VPS; see
    # ADR-0001 and docker/php/Dockerfile's own note), so this line does not
    # by itself close SEC-004's "Server leaks version information" finding.
    # Forge's nginx needs the same directive set independently.
    server_tokens off;

    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Stripe's webhook. Signature verification in the application is
    # unconditional and is what actually authenticates this endpoint;
    # Stripe additionally recommends IP allowlisting at the edge, which is
    # `stripe-ip-allowlist.conf.example` in this directory.
    #
    # It is NOT included here on purpose: `stripe listen` forwards events
    # from your own machine, so an allowlist would reject every locally
    # forwarded event and look exactly like a signature failure. Read that
    # file before enabling it in production, especially the note about
    # $remote_addr behind a load balancer.
    location = /stripe/webhook {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
