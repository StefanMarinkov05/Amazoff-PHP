# Runs nginx and php-fpm as siblings in one container (ADR-0023).
#
# Why one container rather than the two the local stack uses: Railway bills
# and scales per service, and a demo box has no reason to pay for a second
# one just to hold nginx. The local topology keeps them apart because
# docker-compose can name `app:9000` across containers for free; here they
# share a loopback interface instead. docker/production/nginx.conf's
# fastcgi_pass is the only line that has to know the difference.
#
# What is deliberately NOT here: the queue worker and the scheduler. Both are
# separate Railway services built from this same image with their own start
# commands — see ADR-0023's "Three services, one image". Putting them under
# this supervisord would mean the web container's health check governs
# whether mail gets sent and whether orders:expire-unpaid fires, which is the
# opposite of what either needs: a worker that dies should restart without
# taking the site down, and a site that restarts should not silently reset a
# sweep's cadence.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# Both programs log to stdout/stderr rather than files: Railway captures the
# container's streams and there is no persistent disk to rotate a logfile on.
# maxbytes=0 disables supervisor's own rotation, which would otherwise
# truncate the stream it is supposed to be passing through.

[program:php-fpm]
command=php-fpm --nodaemonize --force-stderr
autostart=true
autorestart=true
# Start php-fpm first. nginx exits immediately if it cannot reach its
# upstream on the first request, and Railway's health check can arrive within
# a second of the container starting.
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
# envsubst has already written the real ${PORT} into the config by the time
# supervisord starts — see the entrypoint in the Dockerfile. `daemon off`
# keeps nginx in the foreground so supervisord can actually supervise it.
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
