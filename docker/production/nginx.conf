# nginx for the deployed container (ADR-0023). Paired with supervisord.conf,
# which runs this and php-fpm side by side in one image.
#
# NOT the same file as docker/nginx/default.conf, and the differences are the
# point rather than drift:
#
#   * `fastcgi_pass 127.0.0.1:9000`, not `app:9000`. There is no second
#     container to name here — php-fpm is a sibling process under supervisord
#     in this same image, so the loopback address is the only one that
#     resolves.
#   * `listen ${PORT}`, not 80. Railway assigns the port at runtime and the
#     container must bind exactly it; a hard-coded 80 means the health check
#     never connects and the deploy is marked failed with no useful log line.
#     envsubst in the entrypoint writes the real value before nginx starts.
#   * No Vite dev-server proxying. Assets are built into public/build at
#     image-build time and served straight from disk.
#
# What is deliberately identical to the dev file, because it is owed in both
# places and fixing it in only one is how the two drift:
#   * server_tokens off            (SEC-004)
#   * X-Content-Type-Options on static assets, with `always` (SEC-007)
# Everything else — X-Frame-Options, Referrer-Policy, Permissions-Policy, the
# CSP — comes from App\Http\Middleware\SetSecurityHeaders, which is appended
# globally in bootstrap/app.php and therefore covers every response PHP
# renders, including Filament's. nginx does not restate those: two sources for
# one header is how they disagree.

server {
    listen ${PORT};
    server_name _;
    root /var/www/html/public;

    # SEC-004. Owed here independently of the dev config — that file never
    # reaches a deployed host.
    server_tokens off;

    # SEC-007: static files never reach PHP, so SetSecurityHeaders never runs
    # for them. `always` matters — without it nginx omits the header on
    # non-2xx responses, which is exactly where sniffing is most dangerous.
    add_header X-Content-Type-Options "nosniff" always;

    index index.php;

    # Matches the dev config. Product and article images are the largest
    # uploads the admin panel accepts.
    client_max_body_size 20M;

    # Railway terminates TLS at its edge and forwards over plain HTTP, so
    # every request arrives here as :80/http. bootstrap/app.php's
    # trustProxies() is what makes Laravel read these rather than the
    # connection it can see; this block only ensures php-fpm receives them.
    fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    fastcgi_param HTTP_X_FORWARDED_FOR   $http_x_forwarded_for;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets and seeded demo images. Long cache lifetime is safe for
    # /build because Vite fingerprints every filename; /storage is NOT
    # fingerprinted, so it gets a short one — an admin replacing a product
    # image during a demo should see the new file, not a month-old cache.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /storage/ {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Stripe's webhook. Signature verification in the application
    # (VerifyStripeWebhookSignature, unconditional) is what authenticates
    # this endpoint. The IP allow-list from docker/nginx/ is NOT carried over:
    # it reads $remote_addr, which behind Railway's edge is the proxy rather
    # than Stripe, so enabling it here would reject every genuine event while
    # looking exactly like a signature failure. deploy-and-host.md says so.
    location = /stripe/webhook {
        try_files $uri /index.php?$query_string;
    }

    # Railway's own health check, and Laravel's health endpoint
    # (bootstrap/app.php's `health: '/up'`). Kept out of the access log so a
    # once-a-minute probe does not bury real traffic.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # The demo seed walks 140 orders through real Actions and can exceed
        # the default 60s when run through a web request. It is never run that
        # way — `railway run php artisan demo:seed` is a CLI invocation — but
        # Filament's own bulk actions are web requests and do real work.
        fastcgi_read_timeout 120;
    }

    # Dotfiles, except ACME's challenge path.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
