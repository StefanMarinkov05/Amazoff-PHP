; Dev-only parity with App\Http\Middleware\SetSecurityHeaders and
; docker/nginx/default.conf's server_tokens off — this container is not
; what runs in production (Forge provisions PHP-FPM directly on the VPS;
; see docker/php/Dockerfile's own note), so this file does not by itself
; close SEC-004's "X-Powered-By leaks PHP version" finding for production.
; Forge's php.ini needs the same directive independently.
expose_php = Off
