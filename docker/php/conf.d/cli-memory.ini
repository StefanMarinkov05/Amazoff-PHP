; The default 128M is too low to assemble a full-project coverage report —
; measured: `pest --coverage` across the whole suite exhausts it while
; building coverage.php, after the tests themselves have already passed.
; Larastan needed the same fix via its own --memory-limit=1G flag; this is
; the CLI-wide equivalent so `pest --coverage` doesn't need one too.
memory_limit = 1G
