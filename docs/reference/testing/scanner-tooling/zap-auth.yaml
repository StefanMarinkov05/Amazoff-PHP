# Authenticated OWASP ZAP scan plan for this project.
#
# See docs/reference/testing/scanner-tooling/README.md for the full procedure this
# plan is part of, and
# ~/.claude/skills/website-testing/references/security-tooling.md for the
# general (project-agnostic) traps this plan's shape avoids.
#
# BEFORE RUNNING: replace both placeholders below with a fresh session —
# authenticate via the real Livewire login handshake (see the skill
# reference above for the steps) and substitute the resulting cookie jar
# values. Session lifetime is 120 minutes; a stale cookie here produces a
# scan that silently runs as an anonymous guest, with no error.
#
# LAUNCH COMMAND — the concurrency setting is NOT in this file, on purpose,
# and it must be serial on BOTH phases, not just capped.
#
# threadPerHost on the activeScan job below IS a valid, accepted job
# parameter — but setting it to 2 (instead of 1) still raced
# AuthenticateSession under real testing: the middleware re-validates the
# session on every request, so any concurrency greater than 1 can flap the
# exact same URL between 200 and 302 within the same scan. This is not a
# ZAP misconfiguration, it's inherent to that middleware — the only fix is
# fully serial traffic during an authenticated scan.
#
# The spider phase has no job-level equivalent at all: passing
# threadPerHost to the spider job fails silently (ZAP logs one
# easily-missed "Unrecognised parameter" line and proceeds at uncapped
# concurrency). Spider concurrency is a global option, and active-scan
# concurrency has its OWN, DIFFERENT global option — they are not the same
# key. Both must be passed on the command line, both set to 1:
#
#   docker run --rm --network online_shop_teamb_default \
#     -v "$(pwd)/scratchpad:/zap/wrk:rw" \
#     -u zap \
#     ghcr.io/zaproxy/zaproxy:stable \
#     zap.sh -cmd -autorun /zap/wrk/zap-auth.yaml \
#       -config spider.thread=1 \
#       -config scanner.threadPerHost=1
#
# Confirm it took: grep the container's own stdout for "unrecognised" — its
# ABSENCE means both settings were accepted. That alone does not prove the
# race is gone; separately cross-reference the webserver's access log for
# the SAME url returning both 200 and 302 within the scan window. A single
# 200-then-302 pair separated by most of the scan's duration is expected
# (the session outliving only part of a long scan) and is not this race —
# the signature to watch for is INTERLEAVED 200/302 on the same URL,
# seconds or less apart. The job-level threadPerHost on activeScan below is
# now redundant with the global -config flag but left at 1 for clarity if
# this plan is ever run without the command-line flags.

env:
  contexts:
    - name: "amazoff"
      urls:
        - "http://webserver:80/admin"
        - "http://webserver:80/catalogue"
      includePaths:
        - "http://webserver(:80)?/.*"
      excludePaths:
        - "http://webserver(:80)?/storage/.*"
        - "http://webserver(:80)?/logout.*"   # a spider that follows this ends its own session
jobs:
  - type: script
    parameters:
      action: "add"
      type: "httpsender"
      engine: "ECMAScript : Graal.js"
      name: "addcookie"
      inline: |
        function sendingRequest(msg, initiator, helper) {
          msg.getRequestHeader().setHeader("Cookie",
            "amazoff-session=<SESSION_COOKIE_VALUE>; XSRF-TOKEN=<XSRF_COOKIE_VALUE>");
        }
        function responseReceived(msg, initiator, helper) {}
  - type: spider
    parameters: { context: "amazoff", maxDuration: 8, maxDepth: 6 }
  - type: passiveScan-wait
  - type: activeScan
    parameters: { context: "amazoff", maxScanDurationInMins: 25, threadPerHost: 1 }
  - type: report
    parameters:
      template: "traditional-md"
      reportDir: "/zap/wrk"
      reportFile: "zap-authenticated-report.md"
