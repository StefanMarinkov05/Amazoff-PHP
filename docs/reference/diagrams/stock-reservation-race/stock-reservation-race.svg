ke-miterlimit:10;"/><line x1="53.591" y1="155.023" x2="431.754" y2="155.023" style="stroke:#181818;stroke-width:1;"/><text x="60.591" y="149.958" fill="#000" font-size="13" textLength="40.765">BEGIN</text><polygon points="425.754,180.156,435.754,184.156,425.754,188.156,429.754,184.156" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="58.591" y1="184.156" x2="431.754" y2="184.156" style="stroke:#181818;stroke-width:1;"/><text x="65.591" y="179.09" fill="#000" font-size="13" textLength="152.928">SELECT → reserved = 0</text><polygon points="425.754,209.289,435.754,213.289,425.754,217.289,429.754,213.289" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="245.672" y1="213.289" x2="431.754" y2="213.289" style="stroke:#181818;stroke-width:1;"/><text x="252.672" y="208.223" fill="#000" font-size="13" textLength="40.765">BEGIN</text><polygon points="425.754,238.422,435.754,242.422,425.754,246.422,429.754,242.422" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="250.672" y1="242.422" x2="431.754" y2="242.422" style="stroke:#181818;stroke-width:1;"/><text x="257.672" y="237.356" fill="#000" font-size="13" textLength="152.928">SELECT → reserved = 0</text><path d="M15,255.422 L15,370.422 L284,370.422 L284,265.422 L274,255.422 L15,255.422" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M274,255.422 L274,265.422 L284,265.422 L274,255.422" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="21" y="272.489" fill="#000" font-size="13" textLength="224.948" font-weight="700">Both read before either wrote.</text><text x="21" y="287.622" fill="#000" font-size="13" textLength="234.089">Both decided on state that was true</text><text x="21" y="302.754" fill="#000" font-size="13" textLength="232.972">when read and false once acted on.</text><text x="21" y="317.887" fill="#000" font-size="13" textLength="238.869">This IS the check-then-act pattern —</text><text x="21" y="333.02" fill="#000" font-size="13" textLength="248.263">the window between the two SELECTs</text><text x="21" y="348.153" fill="#000" font-size="13" textLength="242.5">and the two UPDATEs below is where</text><text x="21" y="363.286" fill="#000" font-size="13" textLength="199.818">every version of this bug lives.</text><line x1="58.591" y1="412.617" x2="100.591" y2="412.617" style="stroke:#181818;stroke-width:1;"/><line x1="100.591" y1="412.617" x2="100.591" y2="425.617" style="stroke:#181818;stroke-width:1;"/><line x1="59.591" y1="425.617" x2="100.591" y2="425.617" style="stroke:#181818;stroke-width:1;"/><polygon points="69.591,421.617,59.591,425.617,69.591,429.617,65.591,425.617" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="65.591" y="392.418" fill="#000" font-size="13" textLength="173.082">available = 1 - 0 = 1 >= 1</text><text x="65.591" y="407.551" fill="#000" font-size="13" textLength="59.293" font-weight="700">proceed</text><line x1="250.672" y1="469.883" x2="292.672" y2="469.883" style="stroke:#181818;stroke-width:1;"/><line x1="292.672" y1="469.883" x2="292.672" y2="482.883" style="stroke:#181818;stroke-width:1;"/><line x1="251.672" y1="482.883" x2="292.672" y2="482.883" style="stroke:#181818;stroke-width:1;"/><polygon points="261.672,478.883,251.672,482.883,261.672,486.883,257.672,482.883" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="257.672" y="449.684" fill="#000" font-size="13" textLength="173.082">available = 1 - 0 = 1 >= 1</text><text x="257.672" y="464.817" fill="#000" font-size="13" textLength="59.293" font-weight="700">proceed</text><polygon points="425.754,508.016,435.754,512.016,425.754,516.016,429.754,512.016" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="58.591" y1="512.016" x2="431.754" y2="512.016" style="stroke:#181818;stroke-width:1;"/><text x="65.591" y="506.95" fill="#000" font-size="13" textLength="141.375">UPDATE reserved = 1</text><polygon points="425.754,537.148,435.754,541.148,425.754,545.148,429.754,541.148" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="58.591" y1="541.148" x2="431.754" y2="541.148" style="stroke:#181818;stroke-width:1;"/><text x="65.591" y="536.083" fill="#000" font-size="13" textLength="53.517">COMMIT</text><polygon points="425.754,566.281,435.754,570.281,425.754,574.281,429.754,570.281" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="250.672" y1="570.281" x2="431.754" y2="570.281" style="stroke:#181818;stroke-width:1;"/><text x="257.672" y="565.215" fill="#000" font-size="13" textLength="141.375">UPDATE reserved = 1</text><polygon points="425.754,595.414,435.754,599.414,425.754,603.414,429.754,599.414" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="250.672" y1="599.414" x2="431.754" y2="599.414" style="stroke:#181818;stroke-width:1;"/><text x="257.672" y="594.348" fill="#000" font-size="13" textLength="53.517">COMMIT</text><path d="M277.433,612.414 L277.433,758.414 L597.433,758.414 L597.433,622.414 L587.433,612.414 L277.433,612.414" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M587.433,612.414 L587.433,622.414 L597.433,622.414 L587.433,612.414" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="283.433" y="629.481" fill="#000" font-size="13" textLength="70.123" font-weight="700">Oversold.</text><text x="357.688" y="629.481" fill="#000" font-size="13" textLength="177.817">Both requests reserved the</text><text x="283.433" y="644.614" fill="#000" font-size="13" textLength="249.482">same single unit. reserved=1 satisfies</text><text x="283.433" y="659.747" fill="#000" font-size="13" textLength="293.941">chk_inventories_reserved_not_above_current</text><text x="283.433" y="674.879" fill="#000" font-size="13" textLength="240.354">(it never went above current), so the</text><text x="283.433" y="690.012" fill="#000" font-size="13" textLength="275.583">CHECK constraint — which catches a stale</text><text x="283.433" y="705.145" fill="#000" font-size="13" textLength="255.95">read-modify-write — cannot catch THIS</text><text x="283.433" y="720.278" fill="#000" font-size="13" textLength="222.371">failure, because current never got</text><text x="283.433" y="735.411" fill="#000" font-size="13" textLength="299.641">compared against two DIFFERENT reservation</text><text x="283.433" y="750.543" fill="#000" font-size="13" textLength="196.085">attempts, only the final value.</text><?plantuml-src bLHDRnen4BtlhnXnIRA2BLmh9H8Bf45jaYhGMoHal0DhPR6fxMN3hQV-WAg_CB-aprxIa2ggsij-s6zcdj-yyGdTyROIaXtvaiaFiimF-ZISZQPJKjgphLZib5wJ5ykAiPIS43yYH0klZ7udZPQrjQpblYTqqQkCV00ysnHTwioHSYLKLLlkP3GJ6oOdMGkhJ1TvN5ZmQiELqanFttwIRmp9sdcpOUj8bXoJaQaz6HqPLi9vKfut8K5RsTCv3RfasR7TSO6_VfUqeK25IgwAB4cyyc0_ys6f1KRwRL6ajP2WpHyG_AYSXo8WKnd7IR8LrYkfjWB5EdVyjMQm67P8E1g-lPd7pJmf18GJZgcZz0vSZLNixlNfWVhv4V7p_baC6kT9CgJU1JxeFUMJ3zERe__PvDDaDAUdxpzUdJWHqYiSYa4eoV-8plyz6hMrmTlisDAmYt-YDCsDBn4W2bhoobWcLX3BKcE1pT8Ke0WfMAe2AQ6iyo6TBuMd1eVojcQWcf9rcmXcWJSgA0C7CO50ZCi0cfVAqNGM-n4zqCENxW52M-7XoTWt00EWKRem3NZvXhdrI71HUr07K2ZqlFhbytWudpYWAyIW2lZOm8jnt3tXuO8hp0eHs5tMQwhKZbsMCB84OGwj6K9BiOErurJ0VzIZVdnVu76lqtHhZMGke4rKF_-FWADkjuIFUpKusXtTNbzFvqd1RpV_hU3yBy6lUZzkEtyRD36OeJIbWmkYmTrBMeWBQ1ncXsd5yMgjVFRYwm4slN8hE1z0MJuiZcPXyGnReFP2B55ySHWEW4-L9nsQGqqOzBZzFFPdNNBcK7rqDHbz95n6pbk1UoiETbCgMP8K7YPo988bgm0E_kjjJA5M-rvZSPb4j1GQ35eupQ-cCo0FbrSNXf6YThzB7pYjJU0epGPN08GGQvJ6x0UdZQUNbvExoSty-Be9ReH_Drllkl1wjO_6N2ajAjg9gkOZd_q2?></g></svg>