"ent0020" data-source-line="77"><path d="M1028.42,524.487 L1028.42,610.151 A0,0 0 0 0 1028.42,610.151 L1503.963,610.151 A0,0 0 0 0 1503.963,610.151 L1503.963,534.487 L1493.963,524.487 L1270.2,524.487 L1266.2,463.657 L1262.2,524.487 L1028.42,524.487 A0,0 0 0 0 1028.42,524.487" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1493.963,524.487 L1493.963,534.487 L1503.963,534.487 L1493.963,524.487" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1034.42" y="541.554" fill="#000" font-size="13" textLength="454.543">Not drawn — deliberately: Cart, Contact, Content, ProductReview and</text><text x="1034.42" y="556.687" fill="#000" font-size="13" textLength="447.529">Shipment have zero outgoing edges to another Actions area. Each is</text><text x="1034.42" y="571.819" fill="#000" font-size="13" textLength="451.356">called from the presentation layer (Filament/Livewire/Http) but never</text><text x="1034.42" y="586.952" fill="#000" font-size="13" textLength="453.54">calls into a sibling module's Actions — the actual "high cohesion" half</text><text x="1034.42" y="602.085" fill="#000" font-size="13" textLength="214.367">of the claim this diagram makes.</text></g><!--link Catalogue to Inventory--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk12" data-source-line="48" data-link-type="dependency"><path d="M474.95,74.307 C457.01,77.177 437.34,80.167 419.2,82.597 C357.61,90.817 182.71,66.357 141.2,112.597 C117.44,139.047 118.04,165.607 141.2,192.597 C169.74,225.867 293.53,212.497 336.2,222.597 C348.91,225.597 357.623,228.007 370.253,232.007" style="stroke:#181818;stroke-width:1;" fill="none" id="Catalogue-to-Inventory"/><polygon points="375.02,233.517,367.648,226.986,370.253,232.007,365.232,234.613,375.02,233.517" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="173.421" y="149.797" fill="#000" font-size="13" textLength="133.955">AddProductVariation</text><text x="142.2" y="164.929" fill="#000" font-size="13" textLength="196.396">-> RecordInventoryMovement</text><path d="M344.596,117.597 L344.596,187.597 L542.596,187.597 L542.596,127.597 L532.596,117.597 L344.596,117.597" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M532.596,117.597 L532.596,127.597 L542.596,127.597 L532.596,117.597" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="350.596" y="134.664" fill="#000" font-size="13" textLength="163.033">A new variation starts an</text><text x="350.596" y="149.797" fill="#000" font-size="13" textLength="177.569">inventory row: creating the</text><text x="350.596" y="164.929" fill="#000" font-size="13" textLength="177.684">variation IS the initial stock</text><text x="350.596" y="180.062" fill="#000" font-size="13" textLength="154.426">movement (ADR-0002).</text></g><!--link Order to Inventory--><g class="link" data-entity-1="ent0007" data-entity-2="ent0006" id="lnk13" data-source-line="56" data-link-type="dependency"><path d="M1156.45,63.607 C1039.41,63.337 721.78,66.947 629.2,112.597 C586.02,133.877 594.91,163.997 556.2,192.597 C533.44,209.397 509.835,243.646 485.795,253.816" style="stroke:#181818;stroke-width:1;" fill="none" id="Order-to-Inventory"/><polygon points="481.19,255.764,491.037,255.941,485.795,253.816,487.92,248.573,481.19,255.764" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="717.674" y="149.797" fill="#000" font-size="13" textLength="143.375">TransitionOrderStatus</text><text x="630.2" y="164.929" fill="#000" font-size="13" textLength="318.322">-> CompleteSale / ReleaseStock / RestockReturn</text><path d="M954.522,117.597 L954.522,187.597 L1168.522,187.597 L1168.522,127.597 L1158.522,117.597 L954.522,117.597" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1158.522,117.597 L1158.522,127.597 L1168.522,127.597 L1158.522,117.597" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="960.522" y="134.664" fill="#000" font-size="13" textLength="171.799">The one place ADR-0011's</text><text x="960.522" y="149.797" fill="#000" font-size="13" textLength="185.117">inventory side effects live —</text><text x="960.522" y="164.929" fill="#000" font-size="13" textLength="193.997">a status change moves stock,</text><text x="960.522" y="180.062" fill="#000" font-size="13" textLength="120.155">never the reverse.</text></g><!--link Order to Coupon--><g class="link" data-entity-1="ent0007" data-entity-2="ent0005" id="lnk14" data-source-line="64" data-link-type="dependency"><path d="M1242.17,83.067 C1321.62,119.277 1488.57,195.343 1567.87,231.483" style="stroke:#181818;stroke-width:1;" fill="none" id="Order-to-Coupon"/><polygon points="1572.42,233.557,1565.889,226.185,1567.87,231.483,1562.572,233.464,1572.42,233.557" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1481.29" y="157.297" fill="#000" font-size="13" textLength="208.159">CreateOrder -> RedeemCoupon</text><path d="M1695.449,125.097 L1695.449,180.097 L1889.449,180.097 L1889.449,135.097 L1879.449,125.097 L1695.449,125.097" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1879.449,125.097 L1879.449,135.097 L1889.449,135.097 L1879.449,125.097" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1701.449" y="142.164" fill="#000" font-size="13" textLength="173.234">Redemption is recorded at</text><text x="1701.449" y="157.297" fill="#000" font-size="13" textLength="139.134">order creation, not at</text><text x="1701.449" y="172.429" fill="#000" font-size="13" textLength="153.207">checkout-preview time.</text></g><!--link Order to Support--><g class="link" data-entity-1="ent0007" data-entity-2="ent0011" id="lnk15" data-source-line="71" data-link-type="dependency"><path d="M1200.19,83.057 C1200.53,121.587 1203.03,211.197 1218.2,284.597 C1225.91,321.917 1238.687,380.648 1249.777,408.968" style="stroke:#181818;stroke-width:1;stro